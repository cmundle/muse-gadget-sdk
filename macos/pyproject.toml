[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "musegadget"
version = "0.1.0"
description = "Make any Mac into a Muse Home Link that pairs with the Muse app"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
# cryptography comes from pip on macOS (wheels exist for all supported
# versions); the floor stays at 3.3.2 to match the Linux SDK's protocol code.
# pyobjc-framework-CoreBluetooth provides the BLE peripheral used for pairing.
dependencies = [
    "cryptography>=3.3.2",
    "websockets>=13",
    "pyobjc-framework-CoreBluetooth>=9.0",
]

[project.scripts]
musegadget = "musegadget.cli:main"

[project.optional-dependencies]
test = ["pytest"]
# Optional: home theater control. pyatv drives Apple TV and HomePod mini;
# SoCo drives Sonos speakers over UPnP. Installed separately so the core
# gadget works without them.
hometheater = ["pyatv>=0.14", "soco>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musegadget = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
